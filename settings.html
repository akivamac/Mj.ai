<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings – Monkey Joe</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: block;
      overflow-y: auto;
      padding: 0;
      background: var(--bg);
      font-family: var(--font-body);
    }

    /* ── Page shell ── */
    .settings-page {
      max-width: 600px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    /* ── Top bar ── */
    .settings-topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }
    .back-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.84rem;
      font-family: var(--font-body);
      transition: all 0.13s;
      display: flex; align-items: center; gap: 6px;
    }
    .back-btn:hover { color: var(--text); border-color: var(--accent); background: var(--accent-dim); }

    .settings-title {
      font-family: var(--font-ui);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    /* ── Section cards ── */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .section-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .section-header h2 {
      font-family: var(--font-ui);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .section-body { padding: 6px 0; }

    /* ── Brain parts ── */
    .brain-part {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
    }
    .brain-part:last-child { border-bottom: none; }

    .brain-part-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .brain-part-name {
      font-family: var(--font-ui);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }
    .brain-part-summary {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 3px;
      line-height: 1.5;
    }

    .edit-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.8rem;
      font-family: var(--font-body);
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.13s;
    }
    .edit-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

    .edit-area {
      display: none;
      margin-top: 12px;
    }
    .edit-area textarea {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 0.8rem;
      resize: vertical;
      min-height: 160px;
      transition: border-color 0.15s;
    }
    .edit-area textarea:focus { outline: none; border-color: var(--accent); }

    .save-btn {
      margin-top: 8px;
      background: var(--accent);
      color: white; border: none;
      padding: 8px 16px;
      border-radius: 8px; cursor: pointer;
      font-size: 0.85rem; font-family: var(--font-body);
      font-weight: 500;
      transition: background 0.13s;
    }
    .save-btn:hover { background: var(--accent-light); }

    /* ── Settings rows (MCP etc) ── */
    .settings-row {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .settings-row:last-child { border-bottom: none; }

    .settings-row label {
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--text-muted);
      font-family: var(--font-body);
    }

    .mcp-input {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 13px;
      font-size: 0.88rem;
      font-family: var(--font-body);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .mcp-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .mcp-input::placeholder { color: var(--text-dim); }

    /* ── Hidden chats ── */
    .hidden-chat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 18px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .hidden-chat-row:last-child { border-bottom: none; }
    .hidden-chat-name {
      font-size: 0.87rem;
      color: var(--text);
      flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .empty-state {
      padding: 20px 18px;
      font-size: 0.85rem;
      color: var(--text-dim);
      font-style: italic;
    }

    /* ── Danger zone ── */
    .danger-row {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .danger-label { font-size: 0.87rem; color: var(--text-muted); }
    .danger-btn {
      background: none;
      border: 1px solid rgba(176,48,48,0.3);
      color: #b03030;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: var(--font-body);
      transition: all 0.13s;
      white-space: nowrap;
    }
    .danger-btn:hover { background: rgba(176,48,48,0.06); border-color: #b03030; }
  </style>
</head>
<body>
  <div class="settings-page">

    <!-- Top bar -->
    <div class="settings-topbar">
      <button class="back-btn" onclick="location.href='index.html'">← Back</button>
      <span class="settings-title">Settings</span>
    </div>

    <!-- Joe's Brain -->
    <div class="section">
      <div class="section-header"><h2>Joe's Brain</h2></div>
      <div class="section-body">
        <div id="brain-parts"></div>
      </div>
    </div>

    <!-- Hidden Chats -->
    <div class="section">
      <div class="section-header"><h2>Hidden Chats</h2></div>
      <div class="section-body">
        <div id="hidden-chats-list">
          <div class="empty-state">No hidden chats.</div>
        </div>
      </div>
    </div>

    <!-- MCP Server -->
    <div class="section">
      <div class="section-header"><h2>MCP Server</h2></div>
      <div class="section-body">
        <div class="settings-row">
          <label for="mcp-url">Server URL</label>
          <input class="mcp-input" type="text" id="mcp-url" placeholder="https://your-mcp-server.com/mcp" />
          <div>
            <button class="save-btn" id="mcp-save">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- GitHub -->
    <div class="section">
      <div class="section-header"><h2>GitHub Push</h2></div>
      <div class="section-body">
        <div class="settings-row">
          <label for="github-token">Personal Access Token</label>
          <input class="mcp-input" type="password" id="github-token" placeholder="github_pat_..." />
          <div>
            <button class="save-btn" id="github-token-save">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Account -->
    <div class="section">
      <div class="section-header"><h2>Account</h2></div>
      <div class="section-body">
        <div class="danger-row">
          <span class="danger-label">Sign out of Monkey Joe on this device</span>
          <button class="danger-btn" onclick="sessionStorage.removeItem('mj_auth'); location.href='index.html';">Log out</button>
        </div>
      </div>
    </div>

  </div><!-- /.settings-page -->

  <script src="config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/backside.js"></script>
  <script src="js/brain.js"></script>
  <script>
    // ── Brain parts ──
    const brainKeys = ['knowledge', 'rules', 'terminal'];
    const summaries = {
      knowledge: 'General facts and world knowledge Joe knows.',
      rules:     'How Joe decides what to respond with.',
      terminal:  'Terminal commands and troubleshooting Joe understands.',
    };

    const container = document.getElementById('brain-parts');
    brainKeys.forEach(key => {
      const data = Storage.getBrain(key);
      const div = document.createElement('div');
      div.className = 'brain-part';
      div.innerHTML = `
        <div class="brain-part-header">
          <div>
            <div class="brain-part-name">${key.charAt(0).toUpperCase() + key.slice(1)}</div>
            <div class="brain-part-summary">${summaries[key]}</div>
          </div>
          <button class="edit-btn" data-key="${key}">Edit</button>
        </div>
        <div class="edit-area" id="edit-${key}">
          <textarea id="ta-${key}">${JSON.stringify(data, null, 2)}</textarea>
          <button class="save-btn" data-save="${key}">Save</button>
        </div>
      `;
      container.appendChild(div);
    });

    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.key;
        const area = document.getElementById('edit-' + key);
        const open = area.style.display === 'block';
        area.style.display = open ? 'none' : 'block';
        btn.textContent = open ? 'Edit' : 'Close';
      });
    });

    document.querySelectorAll('[data-save]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.save;
        try {
          const val = JSON.parse(document.getElementById('ta-' + key).value);
          Storage.setBrain(key, val);
          btn.textContent = 'Saved ✓';
          setTimeout(() => btn.textContent = 'Save', 1800);
        } catch(e) {
          alert('Invalid JSON: ' + e.message);
        }
      });
    });

    // ── Hidden chats ──
    const hiddenList = document.getElementById('hidden-chats-list');
    const hidden = Chat.getHiddenChats();
    if (hidden.length) {
      hiddenList.innerHTML = '';
      hidden.forEach(c => {
        const row = document.createElement('div');
        row.className = 'hidden-chat-row';
        row.innerHTML = `
          <span class="hidden-chat-name">${c.title}</span>
          <button class="edit-btn" data-id="${c.id}">Restore</button>
        `;
        row.querySelector('button').addEventListener('click', () => {
          Chat.restoreChat(c.id);
          row.remove();
          if (!hiddenList.querySelectorAll('[data-id]').length)
            hiddenList.innerHTML = '<div class="empty-state">No hidden chats.</div>';
        });
        hiddenList.appendChild(row);
      });
    }

    // ── MCP ──
    const mcpInput = document.getElementById('mcp-url');
    mcpInput.value = Storage.getMcpUrl();
    document.getElementById('mcp-save').addEventListener('click', () => {
      Storage.setMcpUrl(mcpInput.value.trim());
      const btn = document.getElementById('mcp-save');
      btn.textContent = 'Saved ✓';
      setTimeout(() => btn.textContent = 'Save', 1800);
    });

    // ── GitHub token ──
    const ghInput = document.getElementById('github-token');
    ghInput.value = localStorage.getItem('mj_github_token') || '';
    document.getElementById('github-token-save').addEventListener('click', () => {
      localStorage.setItem('mj_github_token', ghInput.value.trim());
      const btn = document.getElementById('github-token-save');
      btn.textContent = 'Saved ✓';
      setTimeout(() => btn.textContent = 'Save', 1800);
    });
  </script>
</body>
</html>
